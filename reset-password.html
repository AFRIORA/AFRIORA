<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Ghana Connect | Reset Password
</title>



<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;

}




:root{

--red:#CE1126;
--gold:#FCD116;
--green:#006B3F;

}





body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(

135deg,

var(--red),

var(--gold),

var(--green)

);


padding:20px;


}







.reset-box{


background:white;

width:100%;

max-width:500px;

padding:40px;

border-radius:30px;


box-shadow:

0 25px 70px rgba(0,0,0,.35);


}






.logo{


text-align:center;

font-size:38px;

font-weight:900;

color:var(--green);


}





h2{

text-align:center;

margin-top:20px;

}




.text{


text-align:center;

color:#666;

margin:15px 0 30px;

line-height:1.5;


}






.otp-container{


display:flex;

justify-content:center;

gap:10px;

margin-bottom:25px;


}






.otp-container input{


width:45px;

height:55px;

font-size:24px;

text-align:center;

border-radius:10px;

border:2px solid #ddd;


}






.input-group{

margin-bottom:20px;


}




label{

display:block;

font-weight:bold;

margin-bottom:8px;


}






.password-box{


position:relative;


}





input[type="password"],
input[type="text"]{


width:100%;

padding:15px;

border-radius:12px;

border:1px solid #ccc;

font-size:16px;


}






.show{


position:absolute;

right:15px;

top:15px;

cursor:pointer;

color:var(--green);

font-weight:bold;


}






.strength{


height:8px;

background:#ddd;

border-radius:10px;

overflow:hidden;

margin-top:8px;


}





#strengthBar{


height:100%;

width:0%;

background:red;

transition:.3s;


}







button{


width:100%;

padding:16px;

border:none;

border-radius:30px;

background:var(--green);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;


}






#message{


text-align:center;

margin-top:20px;

font-weight:bold;


}




</style>



</head>




<body>



<div class="reset-box">





<div class="logo">

GHANA CONNECT

</div>





<h2>

Create New Password

</h2>




<p class="text">

Enter the verification code sent to your phone, then create a new secure password.

</p>







<div class="otp-container">


<input maxlength="1">

<input maxlength="1">

<input maxlength="1">

<input maxlength="1">

<input maxlength="1">

<input maxlength="1">


</div>







<div class="input-group">


<label>

New Password

</label>



<div class="password-box">


<input

type="password"

id="password"

placeholder="Create new password">



<span class="show" id="showPassword">

Show

</span>



</div>



<div class="strength">

<div id="strengthBar"></div>

</div>


</div>








<div class="input-group">


<label>

Confirm Password

</label>


<input

type="password"

id="confirmPassword"

placeholder="Confirm new password">


</div>







<button id="resetBtn">

Reset Password

</button>






<div id="message">

</div>






</div>








<script>



// OTP movement


const otpInputs =
document.querySelectorAll(
".otp-container input"
);



otpInputs.forEach(
(input,index)=>{


input.addEventListener(
"input",
()=>{


if(input.value && index<5){

otpInputs[index+1].focus();

}


});



});







// Show password


document
.getElementById("showPassword")
.onclick=function(){


let pass =
document.getElementById("password");


if(pass.type==="password"){


pass.type="text";

this.innerHTML="Hide";


}

else{


pass.type="password";

this.innerHTML="Show";


}


};







// Password strength


document
.getElementById("password")
.addEventListener(
"input",
function(){



let bar =
document.getElementById("strengthBar");



if(this.value.length<6){

bar.style.width="25%";


}

else if(this.value.length<10){


bar.style.width="60%";


}

else{


bar.style.width="100%";


}



});









// Reset password


document
.getElementById("resetBtn")
.onclick=function(){



let otp="";


otpInputs.forEach(
(input)=>{


otp+=input.value;


});



let password =
document.getElementById("password").value;



let confirm =
document.getElementById("confirmPassword").value;



let message =
document.getElementById("message");





if(otp.length!==6){


message.innerHTML=
"Enter the complete OTP.";


message.style.color="red";

return;


}






if(password!==confirm){


message.innerHTML=
"Passwords do not match.";


message.style.color="red";


return;


}





if(password.length<8){


message.innerHTML=
"Password must be at least 8 characters.";


message.style.color="red";


return;


}






/*

REAL BACKEND:

POST /api/reset-password


DATA:

{
otp:"",
newPassword:""
}


SERVER:

✓ Verify OTP

✓ Check expiry

✓ Hash password

✓ Update password

✓ Invalidate OTP



*/







message.innerHTML=

"Password reset successful ✓";


message.style.color="green";





setTimeout(()=>{


window.location.href="login.html";


},2000);



};



</script>


</body>


</html>
