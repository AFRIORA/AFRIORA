<!DOCTYPE html>
<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Ghana Connect Messages
</title>




<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;

}



:root{

--green:#006B3F;

--gold:#FCD116;

--red:#CE1126;

--light:#f3f5f6;

--white:#ffffff;


}



body{


background:var(--light);

padding:20px;


}





.message-container{


max-width:1000px;

height:85vh;

margin:auto;

display:flex;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:

0 15px 40px rgba(0,0,0,.15);


}









/* ======================
CONVERSATION LIST
====================== */


.chat-list{


width:35%;

border-right:1px solid #ddd;

overflow-y:auto;


}





.chat-header{


padding:20px;

background:var(--green);

color:white;


}



.chat-header h2{


font-size:25px;


}






.user-chat{


display:flex;

gap:15px;

padding:15px;

cursor:pointer;

border-bottom:1px solid #eee;


}



.user-chat:hover{


background:#f5f5f5;


}





.user-chat img{


width:55px;

height:55px;

border-radius:50%;


}



.user-chat h3{


color:var(--green);

font-size:16px;


}



.status{


font-size:13px;

color:green;


}









/* ======================
CHAT AREA
====================== */



.chat-area{


flex:1;

display:flex;

flex-direction:column;


}





.chat-top{


padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #ddd;


}



.chat-user{


display:flex;

align-items:center;

gap:15px;


}



.chat-user img{


width:55px;

height:55px;

border-radius:50%;


}



.chat-user h3{


color:var(--green);


}








.chat-options button{


border:none;

background:#eee;

padding:10px;

border-radius:20px;

cursor:pointer;


}







/* ======================
MESSAGES
====================== */


.messages{


flex:1;

padding:20px;

overflow-y:auto;

background:#fafafa;


}



.message{


max-width:70%;

padding:12px 18px;

border-radius:20px;

margin-bottom:15px;

}



.sent{


background:var(--green);

color:white;

margin-left:auto;


}



.received{


background:#e9e9e9;


}





.time{


font-size:11px;

opacity:.7;

display:block;

margin-top:5px;


}







/* ======================
INPUT
====================== */


.message-input{


display:flex;

gap:10px;

padding:15px;

border-top:1px solid #ddd;


}



.message-input input{


flex:1;

padding:15px;

border-radius:30px;

border:1px solid #ccc;


}



.message-input button{


background:var(--green);

color:white;

border:none;

padding:15px 25px;

border-radius:30px;

cursor:pointer;


}







@media(max-width:700px){



.message-container{


height:90vh;


}



.chat-list{


display:none;


}



}


/* ==========================
TOP NAVIGATION
========================== */

.top-navigation{

max-width:1000px;

margin:0 auto 20px;

display:flex;

align-items:center;

justify-content:space-between;

}

#backBtn{

background:white;

border:none;

padding:12px 25px;

border-radius:30px;

cursor:pointer;

font-weight:bold;

color:var(--green);

box-shadow:0 5px 15px rgba(0,0,0,.12);

transition:.3s;

}

#backBtn:hover{

background:var(--gold);

}

.top-navigation h2{

color:var(--green);

}

</style>



</head>




<body>


<!-- ==========================
TOP NAVIGATION
========================== -->

<div class="top-navigation">

    <button id="backBtn">

        ← Back

    </button>

    <h2>

        Ghana Connect

    </h2>

</div>


<div class="message-container">







<!-- CONVERSATIONS -->



<div class="chat-list">



<div class="chat-header">


<h2>

Messages

</h2>


</div>







<div class="user-chat"
onclick="openChat('Ama Owusu')">



<img src="images/default-profile.png">


<div>


<h3>

Ama Owusu

</h3>


<p class="status">

Online

</p>


</div>



</div>







<div class="user-chat"
onclick="openChat('Kwame Mensah')">


<img src="images/default-profile.png">


<div>


<h3>

Kwame Mensah

</h3>


<p>

Last seen 2h ago

</p>


</div>


</div>






</div>









<!-- CHAT WINDOW -->



<div class="chat-area">





<div class="chat-top">



<div class="chat-user">


<img id="chatPhoto"

src="images/default-profile.png">


<div>


<h3 id="chatName">

Select User

</h3>


</div>


</div>





<div class="chat-options">


<button onclick="blockUser()">

Block

</button>


<button onclick="reportUser()">

Report

</button>


</div>



</div>









<div class="messages" id="messages">



<div class="message received">


Hello, welcome to Ghana Connect


<span class="time">

10:30 AM

</span>


</div>



<div class="message sent">


Thank you 😊


<span class="time">

10:31 AM

</span>


</div>




</div>










<div class="message-input">



<input

id="messageText"

placeholder="Write message..."

>


<button onclick="sendMessage()">

Send

</button>


</div>






</div>









</div>









<script>




// ===================================
// CURRENT USER
// ===================================



const currentUser={


id:1001,

name:"Current User"


};







let selectedUser=null;








// ===================================
// OPEN CHAT
// ===================================



function openChat(name){



selectedUser=name;



document
.getElementById("chatName")
.innerHTML=name;



document
.getElementById("messages")
.innerHTML="";



}








// ===================================
// SEND MESSAGE
// ===================================



function sendMessage(){



let input=

document
.getElementById("messageText");



let text=input.value;



if(text.trim()==="")

return;





let box=document.createElement("div");


box.className="message sent";



box.innerHTML=

text+

`

<span class="time">

Now

</span>

`;




document
.getElementById("messages")
.appendChild(box);



input.value="";





/*

REAL API:


POST /api/messages


DATA:


{

sender_id:

currentUser.id,


receiver_id:

selectedUser.id,


message:text,


created_at:

timestamp


}



DATABASE:

messages table


*/


}








// ===================================
// SECURITY
// ===================================



function blockUser(){


alert(

"User blocked"

);



/*

REAL:


INSERT INTO blocked_users


*/


}







function reportUser(){


alert(

"Report submitted"

);



/*

REAL:


INSERT INTO reports


*/

}


// ==========================
// BACK BUTTON
// ==========================

document
.getElementById("backBtn")
.onclick=function(){

window.history.back();

};


</script>



</body>

</html>
