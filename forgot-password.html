<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Ghana Connect | Forgot Password

</title>

<link rel="stylesheet"
href="forgot-password.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<header>

<a href="login.html" class="back-btn">

<i class="fas fa-arrow-left"></i>

Back to Login

</a>

</header>

<div class="card">

<div class="logo">

GHANA CONNECT

</div>

<h1>

Forgot Password

</h1>

<p>

Enter your registered email address or phone number to receive a verification code.

</p>

<form id="forgotForm">

<div class="input-group">

<label>

Email or Phone Number

</label>

<input

type="text"

id="identity"

placeholder="Enter your email or phone number"

required>

</div>

<button

type="submit"

class="send-btn">

Send Verification Code

</button>

</form>

<div class="divider">

OR

</div>

<a

href="login.html"

class="login-link">

Return to Login

</a>

<div id="message">

</div>

</div>

<footer>

<p>

© 2026 Ghana Connect. All Rights Reserved.

</p>

</footer>

</div>

<script src="forgot-password.js"></script>

</body>

</html>
