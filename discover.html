<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Ghana Connect Feed
</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;

}


:root{

--red:#CE1126;
--gold:#FCD116;
--green:#006B3F;
--dark:#1f2937;
--gray:#6b7280;
--white:white;

--shadow:
0 10px 30px rgba(0,0,0,.12);

}



body{

background:

linear-gradient(
135deg,
#f8fafc,
#eef2f7
);

padding:20px;

}





.feed-container{

max-width:750px;

margin:auto;

}





/* HEADER */

.feed-header{


background:white;

padding:25px;

border-radius:25px;

box-shadow:var(--shadow);

margin-bottom:20px;

}



.top-navigation{


display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;


}



.back-btn{


text-decoration:none;

background:var(--green);

color:white;

padding:10px 18px;

border-radius:25px;

font-weight:bold;

display:flex;

gap:8px;

align-items:center;


}


.back-btn:hover{

background:var(--red);

}





.feed-header h1{


text-align:center;

font-size:34px;

color:var(--green);


}



.feed-header p{


text-align:center;

color:var(--gray);

margin-top:8px;


}





/* CREATE POST */


.create-button{


display:block;

background:var(--green);

color:white;

padding:15px;

border-radius:30px;

text-align:center;

text-decoration:none;

font-weight:bold;

margin-bottom:25px;

transition:.3s;


}


.create-button:hover{


background:var(--red);

transform:translateY(-3px);


}







/* POST CARD */


.post-card{


background:white;

border-radius:25px;

padding:25px;

margin-bottom:25px;

box-shadow:var(--shadow);

}





.post-user{


display:flex;

align-items:center;

gap:15px;

margin-bottom:15px;


}



.post-user img{


width:60px;

height:60px;

border-radius:50%;

object-fit:cover;

border:3px solid var(--gold);


}



.post-user h3{


color:var(--green);

}



.post-user small{


color:var(--gray);

}





.caption{


font-size:17px;

line-height:1.6;

margin-bottom:15px;


}




.post-image{


width:100%;

border-radius:20px;

max-height:500px;

object-fit:cover;


}





.post-stats{


display:flex;

justify-content:space-between;

padding:15px 0;

border-bottom:1px solid #ddd;

color:#555;


}







.post-actions{


display:grid;

grid-template-columns:repeat(4,1fr);

gap:10px;

margin-top:15px;


}



.post-actions button{


border:none;

padding:12px;

border-radius:25px;

cursor:pointer;

font-weight:bold;

background:#f3f4f6;

transition:.3s;


}




.post-actions button:hover{


background:var(--gold);

}





.comment-area{


display:flex;

gap:10px;

margin-top:20px;


}



.comment-area input{


flex:1;

padding:12px;

border-radius:25px;

border:1px solid #ddd;


}



.comment-area button{


background:var(--green);

color:white;

border:none;

padding:10px 20px;

border-radius:25px;

cursor:pointer;


}




.comment{


background:#f3f4f6;

padding:12px;

border-radius:15px;

margin-top:10px;


}




@media(max-width:600px){


body{

padding:10px;

}



.top-navigation{


flex-direction:column;

gap:15px;


}



.post-actions{


grid-template-columns:1fr;

}



.comment-area{


flex-direction:column;


}



}






</style>


</head>




<body>



<div class="feed-container">





<div class="feed-header">


<div class="top-navigation">


<a href="dashboard.html" class="back-btn">

<i class="fas fa-arrow-left"></i>

Dashboard

</a>



</div>




<h1>

GHANA CONNECT

</h1>


<p>

Connect with verified Ghanaians 🇬🇭

</p>



</div>







<a href="posts.html" class="create-button">

<i class="fa-solid fa-plus"></i>

Create Post

</a>






<div id="feed">

</div>




</div>








<script>


const usersPosts=[


{


id:1,

name:"Ama Owusu",

photo:"images/default-profile.png",

time:"10 minutes ago",

caption:"Beautiful evening in Accra 🇬🇭 Looking forward to meeting new people.",

image:"images/sample1.jpg",

likes:120,

comments:25


},



{

id:2,

name:"Kwame Mensah",

photo:"images/default-profile.png",

time:"1 hour ago",

caption:"Starting a new business journey. Hard work pays.",

image:"images/sample2.jpg",

likes:80,

comments:12


},



{

id:3,

name:"Adwoa Boateng",

photo:"images/default-profile.png",

time:"3 hours ago",

caption:"Family, culture and happiness ❤️",

image:"",

likes:55,

comments:7


}


];







const feed=document.getElementById("feed");







usersPosts.forEach(post=>{


let card=document.createElement("div");


card.className="post-card";



card.innerHTML=`


<div class="post-user">


<img src="${post.photo}">


<div>

<h3>

${post.name}

</h3>


<small>

${post.time}

</small>


</div>


</div>





<div class="caption">

${post.caption}

</div>





${post.image ?

`

<img class="post-image"

src="${post.image}">

`

:""}





<div class="post-stats">


<span>

❤️ ${post.likes} Likes

</span>


<span>

💬 ${post.comments} Comments

</span>


</div>





<div class="post-actions">


<button onclick="likePost(${post.id})">

❤️ Like

</button>



<button>

💬 Comment

</button>



<button>

⭐ Save

</button>



<button>

⚠ Report

</button>


</div>







<div class="comment-area">


<input id="comment-${post.id}"

placeholder="Write comment...">



<button onclick="addComment(${post.id})">

Send

</button>


</div>




<div id="comments-${post.id}">

</div>


`;



feed.appendChild(card);



});









function likePost(id){


let post=usersPosts.find(
p=>p.id===id
);


post.likes++;


alert("You liked this post ❤️");


}








function addComment(id){


let input=document.getElementById(
"comment-"+id
);



if(input.value.trim()==="")
return;



let area=document.getElementById(
"comments-"+id
);



let comment=document.createElement("div");


comment.className="comment";


comment.textContent=input.value;



area.appendChild(comment);



input.value="";


}




</script>




</body>

</html>
