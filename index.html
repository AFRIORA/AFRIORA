<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#160b14">

    <title>AFRIORA</title>

    <link
        rel="stylesheet"
        href="index.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <main class="splash">

        <!-- BACKGROUND IMAGES -->

        <div class="background">

            <div class="romance-image image-one"></div>

            <div class="romance-image image-two"></div>

            <div class="romance-image image-three"></div>

            <div class="romance-image image-four"></div>

            <div class="romance-image image-five"></div>

        </div>


        <!-- DARK OVERLAY -->

        <div class="overlay"></div>


        <!-- SOFT GLOW -->

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>


        <!-- FLOATING PARTICLES -->

        <div
            class="particles"
            id="particles">
        </div>


        <!-- CONTENT -->

        <section class="content">

            <div class="brand-symbol">

                <i class="fa-solid fa-heart"></i>

            </div>


            <h1 class="logo">
                AFRIORA
            </h1>


            <p class="tagline">
                Where Hearts Connect Across Borders
            </p>


            <p class="message">
                Discover meaningful connections,
                build relationships and connect
                with people around the world.
            </p>


            <!-- LOADING -->

            <div class="loader">

                <div
                    class="loading"
                    id="loading">
                </div>

            </div>


            <p class="loading-text">
                Preparing your experience...
            </p>

        </section>

    </main>


    <script src="index.js"></script>

</body>

</html>
