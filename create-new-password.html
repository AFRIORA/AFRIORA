<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Ghana Connect | Create New Password
</title>


<link rel="stylesheet"
href="create-new-password.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="container">



<header>

<a href="verify-code.html" class="back-btn">

<i class="fas fa-arrow-left"></i>

Back

</a>

</header>





<div class="card">



<div class="logo">

GHANA CONNECT

</div>



<h1>

Create New Password

</h1>



<p>

Create a strong password to secure your Ghana Connect account.

</p>





<form id="passwordForm">





<div class="input-group">


<label>

New Password

</label>



<div class="password-box">


<input

type="password"

id="newPassword"

placeholder="Enter new password"

required>



<button

type="button"

id="showNewPassword">

Show

</button>


</div>


</div>







<div class="input-group">


<label>

Confirm Password

</label>



<div class="password-box">


<input

type="password"

id="confirmPassword"

placeholder="Confirm new password"

required>



<button

type="button"

id="showConfirmPassword">

Show

</button>


</div>


</div>







<div class="strength">


<div id="strengthBar">

</div>

</div>



<p id="strengthText">

Password strength

</p>






<button

type="submit"

class="reset-btn">


Reset Password


</button>




</form>





<div id="message">

</div>



</div>





<footer>


<p>

© 2026 Ghana Connect. All Rights Reserved.

</p>


</footer>




</div>




<script src="create-new-password.js"></script>


</body>


</html>
